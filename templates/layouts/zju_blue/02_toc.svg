<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- ==================== 页眉区域 ==================== -->
  <!-- 浙大蓝页眉背景 -->
  <rect x="0" y="0" width="1280" height="70" fill="#003F88"/>
  <!-- 左侧accent竖条装饰 -->
  <rect x="0" y="0" width="6" height="70" fill="#ED7D31"/>
  
  <!-- 章节编号 + 页面标题 -->
  <text x="40" y="46" fill="#FFFFFF" font-family="Source Han Sans CN, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">
    {{PAGE_TITLE}}
  </text>
  
  <!-- 右上角 Logo -->
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Source Han Sans CN, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">
    {{LOGO}}
  </text>
  
  <!-- ==================== 目录卡片区域 ==================== -->
  <!-- 卡片1 -->
  <rect x="80" y="140" width="530" height="100" fill="#F5F7FA" rx="6"/>
  <rect x="80" y="140" width="6" height="100" fill="#ED7D31" rx="3"/>
  <text x="110" y="180" fill="#003F88" font-family="Source Han Sans CN, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">
    {{TOC_ITEM_1_TITLE}}
  </text>
  <text x="110" y="215" fill="#545458" font-family="Source Han Sans CN Light, Microsoft YaHei, Arial, sans-serif" font-size="16">
    {{TOC_ITEM_1_DESC}}
  </text>
  
  <!-- 卡片2 -->
  <rect x="670" y="140" width="530" height="100" fill="#F5F7FA" rx="6"/>
  <rect x="670" y="140" width="6" height="100" fill="#2B6CB0" rx="3"/>
  <text x="700" y="180" fill="#003F88" font-family="Source Han Sans CN, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">
    {{TOC_ITEM_2_TITLE}}
  </text>
  <text x="700" y="215" fill="#545458" font-family="Source Han Sans CN Light, Microsoft YaHei, Arial, sans-serif" font-size="16">
    {{TOC_ITEM_2_DESC}}
  </text>
  
  <!-- 卡片3 -->
  <rect x="80" y="280" width="530" height="100" fill="#F5F7FA" rx="6"/>
  <rect x="80" y="280" width="6" height="100" fill="#2B6CB0" rx="3"/>
  <text x="110" y="320" fill="#003F88" font-family="Source Han Sans CN, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">
    {{TOC_ITEM_3_TITLE}}
  </text>
  <text x="110" y="355" fill="#545458" font-family="Source Han Sans CN Light, Microsoft YaHei, Arial, sans-serif" font-size="16">
    {{TOC_ITEM_3_DESC}}
  </text>
  
  <!-- 卡片4 -->
  <rect x="670" y="280" width="530" height="100" fill="#F5F7FA" rx="6"/>
  <rect x="670" y="280" width="6" height="100" fill="#ED7D31" rx="3"/>
  <text x="700" y="320" fill="#003F88" font-family="Source Han Sans CN, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">
    {{TOC_ITEM_4_TITLE}}
  </text>
  <text x="700" y="355" fill="#545458" font-family="Source Han Sans CN Light, Microsoft YaHei, Arial, sans-serif" font-size="16">
    {{TOC_ITEM_4_DESC}}
  </text>
  
  <!-- ==================== 页脚区域 ==================== -->
  <line x1="40" y1="665" x2="1240" y2="665" stroke="#EBF2FA" stroke-width="1"/>
  <text x="640" y="695" text-anchor="middle" fill="#999999" font-family="Source Han Sans CN Light, Microsoft YaHei, Arial, sans-serif" font-size="12">
    {{SECTION_NAME}}
  </text>
</svg>
